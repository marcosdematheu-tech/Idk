<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VTuber Boca</title>
<style>
:root{color-scheme:dark;--fg:#f4f4f7;--card:#20202a;--bd:#393947;--accent:#7c4dff;--frame:#fff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:0;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;color:var(--fg);background:transparent!important;font-family:system-ui,-apple-system,sans-serif}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0;padding:0;background:transparent;border:none;border-radius:0}
#stage.framed{border:5px solid var(--frame);border-radius:24px;margin:8px}
#avatarImg,#avatarSvg{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
#avatarImg{width:100%;height:100%}
#avatarImg.contain{object-fit:contain}
#panel{flex-shrink:0;max-height:60%;overflow-y:auto;padding:12px;background:var(--card);border-top:1px solid var(--bd)}
#controls.hidden{display:none}
.row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
label{font-size:13px;opacity:.9}
select,input[type=range],button{width:100%;min-height:42px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:#15151b;color:var(--fg);font:inherit}
input[type=file]{width:100%;font-size:13px}
input[type=color]{width:100%;height:42px;padding:3px;border:1px solid var(--bd);border-radius:10px;background:#15151b}
button{border:none;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}
button.secondary{background:#30303d;border:1px solid var(--bd)}
#meter{position:relative;height:12px;overflow:hidden;border:1px solid var(--bd);border-radius:8px;background:#101015}
#bar{width:0%;height:100%;background:#8c65ff}
#thr{position:absolute;top:0;bottom:0;left:12%;width:2px;background:#ff4d6d}
#msg{min-height:20px;margin:5px 0 10px;font-size:13px;overflow-wrap:anywhere}
.note{font-size:12px;opacity:.75;line-height:1.4}
#hide{margin-top:8px}
body.direct #panel{display:none}
</style>
</head>
<body>
<div id="stage">
  <img id="avatarImg" class="contain" alt="Avatar VTuber" style="display:none">
  <svg id="avatarSvg" viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg" aria-label="Avatar de ejemplo">
    <circle cx="100" cy="100" r="80" fill="#ffd9b8" stroke="#2b2b35" stroke-width="4"/>
    <circle cx="72" cy="85" r="9" fill="#2b2b35"/>
    <circle cx="128" cy="85" r="9" fill="#2b2b35"/>
    <path id="mClosed" d="M72 130 Q100 138 128 130" stroke="#2b2b35" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse id="mOpen" cx="100" cy="134" rx="22" ry="16" fill="#7a1f2b" stroke="#2b2b35" stroke-width="4" style="display:none"/>
  </svg>
</div>
<div id="panel">
  <div id="controls">
    <div class="row"><label for="dev">Entrada de audio</label><select id="dev"><option value="">Predeterminada</option></select></div>
    <div class="row"><button id="start">Activar micrófono</button></div>
    <div id="msg" role="status">Cargá tus imágenes o usá el avatar de ejemplo.</div>
    <div class="row"><label>Nivel de audio — línea roja: umbral</label><div id="meter"><div id="bar"></div><div id="thr"></div></div></div>
    <div class="row"><label for="th">Umbral para abrir la boca</label><input type="range" id="th" min="1" max="60" value="12"></div>
    <div class="row"><label for="gain">Sensibilidad del micrófono</label><input type="range" id="gain" min="1" max="10" value="4"></div>
    <div class="row"><label for="bg">Fondo del escenario</label><select id="bg"><option value="transparent" selected>Transparente</option><option value="#00b140">Verde (chroma key)</option><option value="#000000">Negro</option><option value="#ffffff">Blanco</option><option value="#7c4dff">Morado</option><option value="custom">Color personalizado</option></select></div>
    <div class="row"><label for="bgc">Color personalizado</label><input type="color" id="bgc" value="#222222"></div>
    <div class="row"><label><input type="checkbox" id="frame"> Mostrar marco</label></div>
    <div class="row"><label for="fcol">Color del marco</label><input type="color" id="fcol" value="#ffffff"></div>
    <div class="row"><label for="fc">Imagen PNG con boca cerrada</label><input type="file" id="fc" accept="image/png,image/*"></div>
    <div class="row"><label for="fo">Imagen PNG con boca abierta</label><input type="file" id="fo" accept="image/png,image/*"></div>
    <p class="note">Para conservar la transparencia, usá PNG con fondo transparente real. Si tu imagen tiene un fondo verde dibujado, este visor no lo elimina automáticamente.</p>
    <div class="row"><button id="direct" class="secondary">Activar modo directo</button></div>
  </div>
  <button id="hide" class="secondary">Ocultar controles</button>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let audioContext=null,analyser=null,stream=null,audioBuffer=null,isOpen=false,lastLoud=0,urlClosed=null,urlOpen=null;
function setMessage(message){$("msg").textContent=message}
function setMouth(open){
  isOpen=open;
  if(urlClosed&&urlOpen){$("avatarImg").src=open?urlOpen:urlClosed}
  else{$("mOpen").style.display=open?"":"none";$("mClosed").style.display=open?"none":""}
}
function refreshAvatar(){
  const useImages=Boolean(urlClosed&&urlOpen);
  $("avatarImg").style.display=useImages?"block":"none";
  $("avatarSvg").style.display=useImages?"none":"block";
  if(useImages){$("avatarImg").src=urlClosed;setMessage("Imágenes cargadas. Activá el micrófono.")}
  else{setMouth(false);setMessage("Para animar tu personaje, cargá las dos imágenes.")}
}
function loadImage(inputId,which){
  const file=$(inputId).files[0];if(!file)return;
  if(!file.type.startsWith("image/")){setMessage("El archivo seleccionado no es una imagen.");return}
  const newUrl=URL.createObjectURL(file),testImage=new Image();
  testImage.onload=()=>{
    if(which==="closed"){if(urlClosed)URL.revokeObjectURL(urlClosed);urlClosed=newUrl}
    else{if(urlOpen)URL.revokeObjectURL(urlOpen);urlOpen=newUrl}
    refreshAvatar();
  };
  testImage.onerror=()=>{URL.revokeObjectURL(newUrl);setMessage("No se pudo abrir esa imagen.")};
  testImage.src=newUrl;
}
async function listDevices(){
  if(!navigator.mediaDevices?.enumerateDevices)return;
  const devices=await navigator.mediaDevices.enumerateDevices(),select=$("dev"),previous=select.value;
  select.innerHTML="";
  const defaultOption=document.createElement("option");defaultOption.value="";defaultOption.textContent="Predeterminada";select.appendChild(defaultOption);
  devices.filter(device=>device.kind==="audioinput").forEach((device,index)=>{
    const option=document.createElement("option");option.value=device.deviceId;option.textContent=device.label||("Entrada "+(index+1));select.appendChild(option);
  });
  if([...select.options].some(option=>option.value===previous))select.value=previous;
}
async function startMicrophone(){
  if(!navigator.mediaDevices?.getUserMedia){setMessage("El navegador no permite usar el micrófono. Abrí la página mediante HTTPS en un navegador compatible.");return}
  $("start").disabled=true;setMessage("Solicitando permiso para usar el micrófono...");
  try{
    if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}
    const deviceId=$("dev").value;
    stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:deviceId?{exact:deviceId}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();
    await audioContext.resume();
    if(analyser)analyser.disconnect();
    analyser=audioContext.createAnalyser();analyser.fftSize=1024;audioBuffer=new Uint8Array(analyser.fftSize);
    audioContext.createMediaStreamSource(stream).connect(analyser);
    await listDevices();
    const activeTrack=stream.getAudioTracks()[0];
    setMessage("Micrófono activo: "+(activeTrack.label||"entrada de audio"));
    $("start").textContent="Reiniciar micrófono";
  }catch(error){setMessage("No se pudo activar el micrófono ("+error.name+"). Revisá los permisos del navegador.")}
  finally{$("start").disabled=false}
}
function animate(){
  if(analyser&&audioBuffer){
    analyser.getByteTimeDomainData(audioBuffer);let sum=0;
    for(let i=0;i<audioBuffer.length;i++){const value=(audioBuffer[i]-128)/128;sum+=value*value}
    const level=Math.min(100,Math.sqrt(sum/audioBuffer.length)*100*Number($("gain").value));
    $("bar").style.width=level+"%";const threshold=Number($("th").value);$("thr").style.left=threshold+"%";
    const now=performance.now();if(level>threshold)lastLoud=now;
    const shouldOpen=now-lastLoud<130;if(shouldOpen!==isOpen)setMouth(shouldOpen);
  }
  requestAnimationFrame(animate);
}
function applyBackground(){
  const value=$("bg").value==="custom"?$("bgc").value:$("bg").value;
  $("stage").style.background=value==="transparent"?"transparent":value;
  document.body.style.background="transparent";
}
$("start").addEventListener("click",startMicrophone);
$("dev").addEventListener("change",()=>{if(stream)startMicrophone()});
$("bg").addEventListener("change",applyBackground);
$("bgc").addEventListener("input",()=>{$("bg").value="custom";applyBackground()});
$("frame").addEventListener("change",()=>$("stage").classList.toggle("framed",$("frame").checked));
$("fcol").addEventListener("input",()=>document.documentElement.style.setProperty("--frame",$("fcol").value));
$("fc").addEventListener("change",()=>loadImage("fc","closed"));
$("fo").addEventListener("change",()=>loadImage("fo","open"));
$("hide").addEventListener("click",()=>{
  const willHide=!$("controls").classList.contains("hidden");
  $("controls").classList.toggle("hidden",willHide);
  $("hide").textContent=willHide?"Mostrar controles":"Ocultar controles";
});
$("direct").addEventListener("click",()=>{
  const isDirect=document.body.classList.toggle("direct");
  $("direct").textContent=isDirect?"Salir del modo directo":"Activar modo directo";
});
$("th").addEventListener("input",()=>$("thr").style.left=$("th").value+"%");
applyBackground();$("thr").style.left=$("th").value+"%";
listDevices().catch(()=>{});animate();
</script>
</body>
</html>
